version: "3.8"

services:
  postgres:
    build: .
    container_name: agentic_postgres
    ports:
       - "4242:5432"
    environment:
      POSTGRES_DB: agentic_mastery
      POSTGRES_USER: agent3
      POSTGRES_PASSWORD: IsThisRealLife?
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
